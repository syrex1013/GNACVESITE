<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Publication pipeline</title>
  <desc id="flow-desc">Report intake with bot checks, storage as a submission row, admin review states, identifier allocation on publish, a BCP-05 record, and the endpoints that serve it to the GCVE ecosystem.</desc>

  <rect width="1200" height="400" fill="#0b0c0e"/>

  <text x="60" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.6" fill="#ff0000">PUBLICATION PIPELINE</text>

  <g id="stage-1" transform="translate(60 76)">
    <rect width="340" height="112" fill="#14161a"/>
    <rect width="340" height="3" fill="#ff0000"/>
    <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f8f9fa">POST /api/submissions</text>
    <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">public form, schema validation</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">honeypot, Turnstile, 5 per hour</text>
  </g>

  <g id="stage-2" transform="translate(430 76)">
    <rect width="340" height="112" fill="#14161a"/>
    <rect width="340" height="3" fill="#ff0000"/>
    <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f8f9fa">submissions row</text>
    <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">SUB-2026-00042, contact details</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">status: new</text>
  </g>

  <g id="stage-3" transform="translate(800 76)">
    <rect width="340" height="112" fill="#14161a"/>
    <rect width="340" height="3" fill="#ff0000"/>
    <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f8f9fa">admin review</text>
    <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">new, in_review, queued, rejected</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">contact details and reporter note</text>
  </g>

  <g id="stage-4" transform="translate(60 264)">
    <rect width="340" height="112" fill="#14161a"/>
    <rect width="340" height="3" fill="#ff0000"/>
    <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f8f9fa">allocate identifier</text>
    <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">GCVE-115-2026-00006</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">next free sequence for the year</text>
  </g>

  <g id="stage-5" transform="translate(430 264)">
    <rect width="340" height="112" fill="#14161a"/>
    <rect width="340" height="3" fill="#ff0000"/>
    <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f8f9fa">gcves.record_json</text>
    <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">BCP-05 record, x_gcve extension</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">CVE link as equal relationship</text>
  </g>

  <g id="stage-6" transform="translate(800 264)">
    <rect width="340" height="112" fill="#14161a"/>
    <rect width="340" height="3" fill="#ff0000"/>
    <text x="24" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#f8f9fa">served to the ecosystem</text>
    <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">/api/gcve/publication, ndjson</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#adb5bd">aggregated by db.gcve.eu</text>
  </g>

  <g id="connectors" fill="none" stroke="#6c757d" stroke-width="2">
    <path d="M400 132 L416 132"/>
    <path d="M770 132 L786 132"/>
    <path d="M970 188 L970 226 L230 226 L230 252"/>
    <path d="M400 320 L416 320"/>
    <path d="M770 320 L786 320"/>
  </g>

  <g id="arrowheads" fill="#6c757d">
    <path d="M414 127 L426 132 L414 137 z"/>
    <path d="M784 127 L796 132 L784 137 z"/>
    <path d="M225 250 L235 250 L230 262 z"/>
    <path d="M414 315 L426 320 L414 325 z"/>
    <path d="M784 315 L796 320 L784 325 z"/>
  </g>

  <text x="596" y="216" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#adb5bd">on publish</text>
</svg>
